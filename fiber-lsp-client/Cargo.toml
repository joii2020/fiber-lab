[package]
name = "fiber-lsp-client"
version = "0.1.0"
edition = "2024"

[dependencies]
fiber-lsp-sdk = { path = "../../fiber/crates/fiber-lsp-sdk" }
fiber-json-types = { path = "../../fiber/crates/fiber-json-types" }
anyhow = "1"
biscuit-auth = "6.0.0-beta.3"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "net", "io-util", "time"] }
zeroize = "1"
ckb-sdk = { version = "5", default-features = false, features = ["rustls-tls"] }
ckb-types = "1"
ckb-jsonrpc-types = "1"
ckb-hash = "1"
secp256k1 = { version = "0.30", features = ["recovery", "global-context"] }
hex = "0.4"
toml = "0.8"
